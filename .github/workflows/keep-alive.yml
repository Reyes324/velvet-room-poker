name: Keep Render service awake

# Render 免费档进程闲置 15 分钟没收到请求就会休眠，唤醒大约要 1 分钟
# （见 render.com/docs/free）。这里每 10 分钟 ping 一次现有的 /health
# 健康检查接口，让它一直保持"最近有访问"，不会被判定闲置。
#
# 公开仓库的 GitHub Actions 分钟数不计入用量额度，免费无限跑。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 30 https://velvet-room-poker.onrender.com/health
