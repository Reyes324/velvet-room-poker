<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 公共牌/手牌牌角数字用 tokens.css 里 --font-card 定义的 Oswald——
         这个 <link> 之前一直没加，字体其实从没真正加载过，牌角数字全程
         是浏览器 sans-serif 兜底渲染的（2026-08-15 用户发现后查证补上）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#17331E" />
    <meta name="apple-mobile-web-app-title" content="翡翠厅" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 曾在 2026-07-31 短暂设为 black-translucent，让页面接管状态栏区域、
         配合深色主题——但这个模式下 WebView 要动态算「整屏减安全区」的可视
         高度，而不是「整屏减一条固定状态栏」，是 WebKit 那个「首帧视口高度
         算不准、要等一次滚动才修正」的 bug 明显更容易触发、也更严重的场景
         （2026-08-01 追查：独立 App 模式底部大片白边正是从切到
         black-translucent 之后才变严重的，此前只有状态栏本身是没适配深色
         主题的白条，不算功能性 bug）。改回 default 后（不声明该 meta）
         底部白边确认修好，但状态栏也跟着变回了不适配深色主题的白条。
         2026-08-01：换成 black（非 translucent）——只把状态栏本身的背景/
         图标换成深色，不让页面接管状态栏区域、不改变 WebView 计算可视区
         域的方式（仍是「整屏减一条固定状态栏」），理论上不会重新触发
         black-translucent 那个 bug；效果和风险都还没有真机验证过。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- interactive-widget=resizes-visual：Android Chrome 键盘弹出的标准
         行为控制——不设的话部分 Chrome 版本默认 resizes-content，会真的
         收缩布局视口（触发 .game-stage 重新排版），resizes-visual 只让
         "可见区域"变小，布局本身不跟着动，是键盘顶起页面这类问题官方推
         荐的免 JS 修法（2026-08-15，查证后加）。iOS Safari 不认这个属
         性，键盘问题在那边靠 body overflow:hidden 解决，见 global.css。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>翡翠厅</title>
    <!-- 白屏焦虑修复（用户反馈，2026-08-16）：内联、硬编码色值（不等 JS/
         字体加载），HTML 一到浏览器就能立即绘制，覆盖"HTML 已到但 React
         还没挂载完成"这一小段空窗。React 挂载后会移除这个 div（见
         App.jsx）。真正"HTML 本身都还没到浏览器"（Render 免费档冷启动，
         进程还没醒）那段空白，这里无能为力——那时候这段 HTML/CSS 也还没
         送到，不是这个方案要解决的部分，见 design.md 同名章节。 -->
    <style>
      #boot-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #17331E; color: #D4AF37;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #boot-loader-spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(212,175,55,.25); border-top-color: #D4AF37;
        animation: boot-spin .8s linear infinite;
      }
      #boot-loader-text { font-size: 14px; letter-spacing: 1px; opacity: .85; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body translate="no">
    <div id="root"></div>
    <div id="boot-loader">
      <div id="boot-loader-spinner"></div>
      <div id="boot-loader-text">翡翠厅 加载中…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
