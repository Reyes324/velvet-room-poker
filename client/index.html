<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#17331E" />
    <meta name="apple-mobile-web-app-title" content="翡翠厅" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 曾在 2026-07-31 短暂设为 black-translucent，让页面接管状态栏区域、
         配合深色主题——但这个模式下 WebView 要动态算「整屏减安全区」的可视
         高度，而不是「整屏减一条固定状态栏」，是 WebKit 那个「首帧视口高度
         算不准、要等一次滚动才修正」的 bug 明显更容易触发、也更严重的场景
         （2026-08-01 追查：独立 App 模式底部大片白边正是从切到
         black-translucent 之后才变严重的，此前只有状态栏本身是没适配深色
         主题的白条，不算功能性 bug）。改回默认（不声明该 meta，等价于
         default/opaque），换回一条稳定不跳变的原生状态栏，用视觉上的
         「状态栏没跟深色主题走」换掉一个真实的布局 bug——按项目优先级，
         正确性优先于这层视觉打磨。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>翡翠厅</title>
  </head>
  <body translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
